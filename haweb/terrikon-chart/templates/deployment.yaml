apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terrikon-app.fullname" . }}
  labels:
    {{- include "terrikon-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "terrikon-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "terrikon-app.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 80
        resources:
          {{- toYaml .Values.resources | nindent 10 }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "terrikon-app.fullname" . }}
  labels:
    {{- include "terrikon-app.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
  selector:
    {{- include "terrikon-app.selectorLabels" . | nindent 4 }}
